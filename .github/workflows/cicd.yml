name: CICD

on:
  workflow_dispatch:
    inputs:
      reset-deployments:
        description: "Reset deployment: Clean start"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - released

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  docker-build:
    name: Build Docker Images
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runs-on }}

    concurrency:
      group: ${{ github.workflow }}-build-${{ matrix.image }}-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      matrix:
        image: ["yoma-api", "yoma-web"]
        arch: ["amd64", "arm64"]
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
          - image: yoma-api
            context: ./src/api
            helm: ./helm/yoma-api
            file: ./src/api/Dockerfile
            buildArgs: ""
          - image: yoma-web
            context: .
            helm: ./helm/yoma-web
            file: ./src/web/Dockerfile
            buildArgs: |-
              NEXT_PUBLIC_ENVIRONMENT=production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://github.com/actions/runner/pull/2477
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: master
          filters: |-
            changes:
              - '${{ matrix.context }}/**'
              - '${{ matrix.helm }}/**'
      - name: Should build?
        id: should-run
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |-
          if [ "${{ github.event_name }}" = "release" ] || \
              [ "$CHANGES" = "true" ] || \
              [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo run=true >> $GITHUB_OUTPUT
          else
            echo run=false >> $GITHUB_OUTPUT
          fi
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.should-run.outputs.run == 'true'
        with:
          cache-binary: false
          version: latest
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.should-run.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.should-run.outputs.run == 'true'
        with:
          platforms: linux/${{ matrix.arch }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: |
            type=gha,scope=build-${{ matrix.image }}-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image }}:latest
          cache-to: type=gha,scope=build-${{ matrix.image }}-${{ matrix.arch }}
          build-args: ${{ matrix.buildArgs }}

  docker-push:
    name: Push Docker Images
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04

    concurrency:
      group: ${{ github.workflow }}-push-${{ matrix.image }}-${{ github.ref }}
      cancel-in-progress: true

    needs: docker-build

    outputs:
      image_version: ${{ steps.meta.outputs.version }}

    strategy:
      matrix:
        image: ["yoma-api", "yoma-web"]
        include:
          - image: yoma-api
            context: ./src/api
            helm: ./helm/yoma-api
          - image: yoma-web
            context: .
            helm: ./helm/yoma-web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://github.com/actions/runner/pull/2477
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: master
          filters: |-
            changes:
              - '${{ matrix.context }}/**'
              - '${{ matrix.helm }}/**'
      - name: Should build?
        id: should-run
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |-
          if [ "${{ github.event_name }}" = "release" ] || \
              [ "$CHANGES" = "true" ] || \
              [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo run=true >> $GITHUB_OUTPUT
          else
            echo run=false >> $GITHUB_OUTPUT
          fi
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.should-run.outputs.run == 'true'
        with:
          cache-binary: false
          version: latest
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.should-run.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=pr-${{ github.event.pull_request.number }}-,priority=601,enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix={{branch}}-,priority=601,enable=${{ github.event_name != 'pull_request' && github.event_name != 'release'  }}
            type=ref,event=branch,priority=600
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create and push multi-arch manifest
        if: steps.should-run.outputs.run == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |-
          # Combine the per-arch images pushed by docker-build into one manifest list per tag
          echo "$TAGS" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Creating manifest for: $tag"
              docker buildx imagetools create \
                --tag "$tag" \
                "${REGISTRY}/${IMAGE}:sha-${SHA}-amd64" \
                "${REGISTRY}/${IMAGE}:sha-${SHA}-arm64"
            fi
          done

  deploy:
    name: Deploy
    permissions:
      contents: write
      id-token: write
      packages: read
    needs: [docker-push]
    runs-on: ubuntu-24.04

    env:
      TAILSCALE_VERSION: latest
      HELMFILE_VERSION: v1.5.1
      HELM_VERSION: v4.2.0
      TAG: ${{ needs.docker-push.outputs.image_version }}

    concurrency:
      group: ${{ github.workflow }}-deploy-${{ github.event_name == 'release' && 'prod' || (github.event_name == 'push' && github.event.repository.default_branch == github.ref_name) && 'stage' || 'dev' }}
      cancel-in-progress: false
    environment:
      name: ${{
        github.event.inputs.reset-deployments == 'true' && 'dev' ||
        github.event_name == 'release' && 'prod' ||
        (github.event_name == 'push' && github.event.repository.default_branch == github.ref_name) && 'stage' ||
        'dev'
        }}
      url: ${{ vars.PUBLIC_URL }}

    if: github.triggering_actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://github.com/actions/runner/pull/2477
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: master
          filters: |-
            api:
              - './src/api/**'
              - './helm/yoma-api/**'
            web:
              - './src/web/**'
              - './helm/yoma-web/**'
            keycloak:
              - './src/keycloak/**'
              - './helm/keycloak/**'
      - name: Should deploy?
        id: should-run
        env:
          API: ${{ steps.filter.outputs.api }}
          WEB: ${{ steps.filter.outputs.web }}
          KEYCLOAK: ${{ steps.filter.outputs.keycloak }}
        run: |-
          if [ "${{ github.event_name }}" = "release" ] || \
              [ "$API" = "true" ] || \
              [ "$WEB" = "true" ] || \
              [ "$KEYCLOAK" = "true" ] || \
              [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
             echo run=true >> $GITHUB_OUTPUT
          else
            echo run=false >> $GITHUB_OUTPUT
          fi
      - name: SOPS Binary Installer
        if: steps.should-run.outputs.run == 'true'
        uses: mdgreenwald/mozilla-sops-action@55177c1ff20a2b396280e4c5f53c32b69f0c1e40 # v2.1.1
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        if: steps.should-run.outputs.run == 'true'
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-cicd
      - run: aws eks update-kubeconfig --name ${{ secrets.CLUSTER }}
        if: steps.should-run.outputs.run == 'true'
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        if: steps.should-run.outputs.run == 'true'
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ secrets.TAILSCALE_TAGS }}
          version: ${{ env.TAILSCALE_VERSION }}
      - name: Helmfile Destroy
        if: github.event.inputs.reset-deployments == 'true'
        uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with:
          helmfile-args: |
            destroy \
              --environment dev
          helm-plugins: >-
            https://github.com/databus23/helm-diff@v3.15.7,
            https://github.com/jkroepke/helm-secrets@v4.7.6,
            https://github.com/aslafy-z/helm-git@v1.5.2
          helmfile-version: ${{ env.HELMFILE_VERSION }}
          helm-version: ${{ env.HELM_VERSION }}
      - name: Delete Pods and PVCs
        if: github.event.inputs.reset-deployments == 'true'
        run: kubectl delete pods,pvc --all --namespace yoma-v3-dev
      - name: Deploy fresh DBs
        if: github.event.inputs.reset-deployments == 'true'
        uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with:
          helmfile-args: |
            apply \
              --environment dev \
              --selector=app=postgresql-keycloak \
              --selector=app=postgresql \
              --selector=app=valkey
          helmfile-version: ${{ env.HELMFILE_VERSION }}
          helm-version: ${{ env.HELM_VERSION }}
          helm-plugins: >-
            https://github.com/databus23/helm-diff@v3.15.7,
            https://github.com/jkroepke/helm-secrets@v4.7.6,
            https://github.com/aslafy-z/helm-git@v1.5.2
      # Diff on PR draft, otherwise Apply
      - name: Helmfile Apply/Diff Keycloak
        if: (
          github.event_name == 'release' ||
          steps.filter.outputs.keycloak == 'true' ||
          github.event_name == 'workflow_dispatch'
          ) && steps.should-run.outputs.run == 'true'
        uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with:
          helmfile-args: |
            ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft) && 'diff' || 'apply' }} \
              --environment ${{ vars.ENVIRONMENT }} \
              --selector app=keycloak \
              --set config-cli.init.ref=${{ github.event_name == 'release' && github.ref_name || github.sha }} \
              --set keycloak.providers.ref=${{ github.event_name == 'release' && github.ref_name || github.sha }} \
              --set postInstallHook.ref=${{ github.event_name == 'release' && github.ref_name || github.sha }}
          helmfile-version: ${{ env.HELMFILE_VERSION }}
          helm-version: ${{ env.HELM_VERSION }}
          helm-plugins: >-
            https://github.com/databus23/helm-diff@v3.15.7,
            https://github.com/jkroepke/helm-secrets@v4.7.6,
            https://github.com/aslafy-z/helm-git@v1.5.2
      # On fresh deployment we want single replica due to DB migrations
      - name: Helmfile Apply Fresh API
        if: github.event.inputs.reset-deployments == 'true'
        uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with:
          helmfile-args: |
            apply \
              --environment dev \
              --selector app=yoma-api \
              --set postInstallHook.ref=${{ github.sha }} \
              --set replicaCount=1
          helmfile-version: ${{ env.HELMFILE_VERSION }}
          helm-version: ${{ env.HELM_VERSION }}
          helm-plugins: >-
            https://github.com/databus23/helm-diff@v3.15.7,
            https://github.com/jkroepke/helm-secrets@v4.7.6,
            https://github.com/aslafy-z/helm-git@v1.5.2
      - name: Helmfile Apply/Diff API
        if: (
          github.event_name == 'release' ||
          steps.filter.outputs.api == 'true' ||
          github.event_name == 'workflow_dispatch'
          ) && steps.should-run.outputs.run == 'true'
        uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with:
          helmfile-args: |
            ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft) && 'diff' || 'apply' }} \
              --environment ${{ vars.ENVIRONMENT }} \
              --selector app=yoma-api \
              --set postInstallHook.ref=${{ github.event_name == 'release' && github.ref_name || github.sha }}
          helmfile-version: ${{ env.HELMFILE_VERSION }}
          helm-version: ${{ env.HELM_VERSION }}
          helm-plugins: >-
            https://github.com/databus23/helm-diff@v3.15.7,
            https://github.com/jkroepke/helm-secrets@v4.7.6,
            https://github.com/aslafy-z/helm-git@v1.5.2
      - name: Trigger Vercel Production Deployment
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git branch -f vercel/prod
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" vercel/prod
      - name: Helmfile Apply/Diff Web
        if: (
          github.event_name == 'release' ||
          steps.filter.outputs.web == 'true' ||
          github.event_name == 'workflow_dispatch'
          ) && steps.should-run.outputs.run == 'true'
        uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with:
          helmfile-args: |
            ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft) && 'diff' || 'apply' }} \
              --environment ${{ vars.ENVIRONMENT }} \
              --selector app=yoma-web
          helmfile-version: ${{ env.HELMFILE_VERSION }}
          helm-version: ${{ env.HELM_VERSION }}
          helm-plugins: >-
            https://github.com/databus23/helm-diff@v3.15.7,
            https://github.com/jkroepke/helm-secrets@v4.7.6,
            https://github.com/aslafy-z/helm-git@v1.5.2

image:
  repository: ghcr.io/didx-xyz/yoma-web
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: master

env:
  NEXT_PUBLIC_API_BASE_URL: https://api.yoma.world/api/v3
  NEXT_PUBLIC_ENVIRONMENT: production
  MARKETPLACE_ENABLED: true
  NEXT_PUBLIC_PASSPORT_ENABLED: true
  NEXT_PUBLIC_REFERRALS_ENABLED: true

middlewares:
  # Sends the old hosts to yoma.world, keeping the path and query.
  redirect-legacy-hosts:
    redirectRegex:
      regex: ^https?://(?:app\.yoma\.world|app\.yoma\.africa|partner\.yoma\.world|www\.yoma\.world)/(.*)
      replacement: https://yoma.world/${1}
      permanent: true
  # Sends the old sign-in pages to the yoma.world home page.
  redirect-legacy-auth:
    redirectRegex:
      regex: ^https?://[^/]+/(?:register|login|employer/auth/login)$
      replacement: https://yoma.world
      permanent: true

ingress:
  internal:
    middlewares:
      - redirect-legacy-hosts
      - redirect-legacy-auth
    rules:
      - host: yoma.world
      - host: app.yoma.world
      - host: partner.yoma.world
      - host: app.yoma.africa
  external:
    enabled: true
    middlewares:
      - redirect-legacy-hosts
      - redirect-legacy-auth
    rules:
      - host: yoma.world
      - host: app.yoma.world
      - host: partner.yoma.world
      - host: app.yoma.africa
      - host: www.yoma.world

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 2000m
    memory: 384Mi

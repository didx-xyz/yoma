replicaCount: 2

image:
  repository: ghcr.io/didx-xyz/yoma-api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "master"

middlewares:
  cors:
    headers:
      accessControlAllowOriginList:
        - https://stage.yoma.world
        - https://yoma-six.vercel.app

ingress:
  internal:
    enabled: true
    rules:
      - host: v3api.stage.yoma.world
  external:
    enabled: true
    rules:
      - host: v3api.stage.yoma.world
  external-hangfire:
    enabled: true
    rules:
      - host: v3api.stage.yoma.world
        paths:
          - path: /(?i)hangfire
            pathType: ImplementationSpecific

env:
  ASPNETCORE_ENVIRONMENT: "Staging"
  # ConnectionStrings__SQLConnection: "Data Source=mssql-mssqlserver-2022,1433;Initial Catalog=yoma-stage;MultipleActiveResultSets=true;User ID=sa;Password=Password1;TrustServerCertificate=True;Encrypt=True"

appSettings:
  fileName: appsettings.Staging.json

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 10Gi
  - name: app-settings
    secret:
      secretName: yoma-api

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: app-settings
    mountPath: /api/appsettings.Staging.json
    subPath: appsettings.Staging.json

postInstallHook:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 768Mi

autoscaling:
  enabled: true
  maxReplicas: 5
  targetCPUUtilizationPercentage: 200
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true

replicaCount: 2

image:
  repository: ghcr.io/didx-xyz/yoma-api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "master"

middlewares:
  cors:
    headers:
      accessControlAllowOriginList:
        - https://yoma.world

ingress:
  internal:
    enabled: true
    rules:
      - host: api.yoma.world
  external:
    enabled: true
    rules:
      - host: api.yoma.world
  external-hangfire:
    enabled: true
    rules:
      - host: api.yoma.world
        paths:
          - path: /(?i)hangfire
            pathType: ImplementationSpecific

env:
  ASPNETCORE_ENVIRONMENT: "Production"
  # ConnectionStrings__SQLConnection: "Data Source=mssql-mssqlserver-2022,1433;Initial Catalog=yoma-stage;MultipleActiveResultSets=true;User ID=sa;Password=Password1;TrustServerCertificate=True;Encrypt=True"

appSettings:
  fileName: appsettings.Production.json

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 10Gi
  - name: app-settings
    secret:
      secretName: yoma-api

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: app-settings
    mountPath: /api/appsettings.Production.json
    subPath: appsettings.Production.json

postInstallHook:
  enabled: false

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 2500m
    memory: 2.5Gi

autoscaling:
  enabled: true
  maxReplicas: 5
  targetCPUUtilizationPercentage: 100
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true

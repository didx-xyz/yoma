# Default values for yoma-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: local/yoma-api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  ad.datadoghq.com/yoma-api.logs: '[{ "service" : "yoma-api", "source" : "csharp"}]'
  # gcr.io/datadoghq/dd-lib-dotnet-init
  admission.datadoghq.com/dotnet-lib.version: v3.55.0
deploymentLabels:
  tags.datadoghq.com/service: yoma-api
  tags.datadoghq.com/version: "{{ .Values.image.tag | default .Chart.AppVersion }}"
podLabels:
  admission.datadoghq.com/enabled: "false" # disabled by default (for now)
  tags.datadoghq.com/service: yoma-api
  tags.datadoghq.com/version: "{{ .Values.image.tag | default .Chart.AppVersion }}"
commonLabels: {}

env:
  DD_RUNTIME_METRICS_ENABLED: true
  # https://docs.datadoghq.com/tracing/other_telemetry/connect_logs_and_traces/dotnet/?tab=serilog#automatic-injection
  DD_LOGS_INJECTION: true
  # https://docs.datadoghq.com/profiler/enabling/dotnet/?tab=linux#configuration
  DD_PROFILING_ENABLED: false # Disabled by default (for now)
  DD_PROFILING_HEAP_ENABLED: true
  DD_PROFILING_ALLOCATION_ENABLED: true

podSecurityContext:
  fsGroup: 1000

securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8000
  # portName:  core
  # targetPort: core # Defaults to http
  # addPorts:
  #   signatory:
  #     port: 7001
  #     targetPort: signatory-container-port
  #   custodian:
  #     port: 7002
  #   auditor:
  #     port: 7003
  #   essif:
  #     port: 7004

# Traefik Middlewares, named `<fullname>-<key>`. Ingresses reference them by key in `middlewares`.
middlewares:
  # https://docs.datadoghq.com/tracing/other_telemetry/rum/?tab=datadog&site=eu#how-rum-resources-are-linked-to-traces
  # Allowed origins are set per environment.
  cors:
    headers:
      accessControlAllowCredentials: true
      accessControlAllowMethods: [GET, PUT, POST, DELETE, PATCH, OPTIONS]
      accessControlAllowHeaders:
        [
          DNT, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since,
          Cache-Control, Content-Type, Range, Authorization, traceparent,
          tracestate, x-datadog-trace-id, x-datadog-parent-id, x-datadog-origin,
          x-datadog-sampling-priority, Tus-Resumable, Upload-Length, Upload-Offset,
          Upload-Metadata, Upload-Checksum, Upload-Concat, Upload-Defer-Length,
        ]
      accessControlExposeHeaders:
        [
          Location, Content-Disposition, Content-Length, Tus-Resumable, Tus-Version,
          Tus-Extension, Tus-Max-Size, Tus-Checksum-Algorithm, Upload-Length,
          Upload-Offset, Upload-Metadata, Upload-Checksum, Upload-Concat, Upload-Expires,
        ]
      accessControlAllowOriginList: []
      accessControlMaxAge: 1728000
      addVaryHeader: true
  # No client address matches, so every request gets a 403.
  deny-all:
    ipAllowList:
      sourceRange:
        - 255.255.255.255/32

# Traefik streams request and response bodies, so TUS uploads need no buffering settings.
ingress:
  internal:
    enabled: false
    className: traefik-internal
    middlewares:
      - cors
    rules:
      - host: example.com
        paths:
          - path: /
            port: 8000
  external:
    enabled: false
    className: traefik-external
    middlewares:
      - cors
    rules:
      - host: example.com
        paths:
          - path: /
            port: 8000
  # Blocks the Hangfire dashboard on the public host. ASP.NET Core matches paths
  # case-insensitively, so the regex does too. Overrides must keep the `paths` entry.
  external-hangfire:
    enabled: false
    className: traefik-external
    annotations:
      traefik.ingress.kubernetes.io/router.pathmatcher: PathRegexp
    middlewares:
      - deny-all
    rules:
      - host: example.com
        paths:
          - path: /(?i)hangfire
            pathType: ImplementationSpecific

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
  behavior:
    # https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#default-behavior
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15

nodeSelector: {}
tolerations: []
affinity: {}
podAffinityPreset: ""
podAntiAffinityPreset: soft
nodeAffinityPreset:
  type: soft
  key: node.kubernetes.io/lifecycle
  values:
    - spot

volumeMounts:
  - name: tmp
    mountPath: /tmp
volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 10Gi
persistence: {}

initContainers: []

postInstallHook:
  enabled: false
  ref: master
  initContainers:
    - name: download-sql
      image: docker.io/busybox:stable
      imagePullPolicy: IfNotPresent
      command:
        - sh
      args:
        - -c
        - |-
          cd /init
          wget -qO - \
            --header="Accept:application/vnd.github.v3.raw" \
            https://api.github.com/repos/didx-xyz/yoma/tarball/{{ .Values.postInstallHook.ref }} | tar xz
          cp -v ./didx-xyz-yoma-*/src/api/cicd/scripts/postgressql-init/* /init/
          chmod +x /init/post.sh
          rm -rvf ./didx-xyz-yoma-*
      volumeMounts:
        - name: init
          mountPath: /init

livenessProbe:
  enabled: true
  # failureThreshold: 3
  httpGet:
    path: /api/v3/health/live
    port: http
  # initialDelaySeconds: 0
  # periodSeconds: 10
  # successThreshold: 1
  # timeoutSeconds: 1
readinessProbe:
  enabled: true
  # failureThreshold: 3
  httpGet:
    path: /api/v3/health/ready
    port: http
  # initialDelaySeconds: 0
  # periodSeconds: 10
  # successThreshold: 1
  # timeoutSeconds: 1
startupProbe:
  enabled: true
  failureThreshold: 30
  httpGet:
    path: /api/v3/health/live
    port: http
  # initialDelaySeconds: 0
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 3

lifecycleHooks:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 5
    # sleep:
    #   seconds: 5

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
  minAvailable: 1

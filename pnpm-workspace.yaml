packages:
  - src/web

allowBuilds:
  sharp: true
  unrs-resolver: true

nodeLinker: hoisted

# Lets `pnpm deploy` (web Dockerfile) install from this lockfile. The legacy
# deploy re-resolves dependencies and can pull versions the lockfile never pinned.
injectWorkspacePackages: true

# `@types/minimatch` pinned to 5.1.2 to avoid the type-error regression seen
# in PR #1805 (`fix(web): resolve JSX.Element type errors and pin @types/minimatch`).
overrides:
  "@types/minimatch": 5.1.2
